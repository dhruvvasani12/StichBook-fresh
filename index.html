
<section id="loginPanel" class="panel narrow">
  <h2>Sign in</h2>
  <p class="muted">Sign in to your StitchBook account.</p>

  <form id="loginForm">
    <label>
      Email
      <input id="email" type="email" autocomplete="username" required>
    </label>

    <label>
      Password
      <input id="password" type="password" autocomplete="current-password" required>
    </label>

    <button id="loginButton" type="submit">Sign in</button>
    <p id="loginMessage" class="message" aria-live="polite"></p>
  </form>

  <hr>

  <h2>Create a worker account</h2>
  <p class="muted">New workers can register here.</p>

  <form id="registerForm">
    <label>
      Full name
      <input id="registerName" type="text" maxlength="100"
             autocomplete="name" required>
    </label>

    <label>
      Email
      <input id="registerEmail" type="email"
             autocomplete="email" required>
    </label>

    <label>
      Password
      <input id="registerPassword" type="password"
             minlength="8" autocomplete="new-password" required>
    </label>

    <label>
      Confirm password
      <input id="confirmPassword" type="password"
             minlength="8" autocomplete="new-password" required>
    </label>

    <button id="registerButton" type="submit">Create worker account</button>
    <p id="registerMessage" class="message" aria-live="polite"></p>
  </form>
</section>
