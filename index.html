
<section id="loginPanel" class="auth-page">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="auth-logo">S</div>
      <h1>StitchBook</h1>
      <p>Your work. Your records. All in one place.</p>
    </div>

    <!-- SIGN IN VIEW -->
    <div id="signInView">
      <h2>Welcome back!</h2>
      <p class="auth-subtitle">
        Sign in to continue to your account.
      </p>

      <form id="loginForm" class="auth-form">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          placeholder="Enter your email"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button id="loginButton" class="auth-primary" type="submit">
          Sign In
        </button>

        <p id="loginMessage" class="message" aria-live="polite"></p>
      </form>

      <div class="auth-switch">
        Don't have an account?
        <button type="button" id="showRegister" class="auth-link">
          Register
        </button>
      </div>
    </div>

    <!-- REGISTER VIEW: HIDDEN INITIALLY -->
    <div id="registerView" hidden>
      <h2>Create your account</h2>
      <p class="auth-subtitle">
        Register to start using StitchBook.
      </p>

      <form id="registerForm" class="auth-form">
        <label for="registerName">Full name</label>
        <input
          id="registerName"
          type="text"
          placeholder="Enter your full name"
          maxlength="100"
          autocomplete="name"
          required
        >

        <label for="registerEmail">Email address</label>
        <input
          id="registerEmail"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="registerPassword">Password</label>
        <input
          id="registerPassword"
          type="password"
          placeholder="At least 8 characters"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          type="password"
          placeholder="Enter your password again"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button id="registerButton" class="auth-primary" type="submit">
          Create Account
        </button>

        <p id="registerMessage" class="message" aria-live="polite"></p>
      </form>

      <div class="auth-switch">
        Already have an account?
        <button type="button" id="showLogin" class="auth-link">
          Sign In
        </button>
      </div>
    </div>

    <p class="auth-footer">Simple. Organized. StitchBook.</p>

  </div>
</section>
